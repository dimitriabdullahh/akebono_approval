<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="csrf-token" content="test-token">
    <title>Test Outstanding Alert</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons@latest/tabler-icons.min.css" rel="stylesheet">
</head>
<body>
    <div class="container py-5">
        <h1>Outstanding Alert Test</h1>
        
        <div class="alert alert-info">
            Replace TOKEN in URL below with actual supplier token
        </div>
        
        <div id="test-result"></div>
        
        <!-- Include the component HTML for testing -->
        <div id="outstanding-alert-container" class="mb-4" style="display: none;">
            <div class="card border-0 shadow-lg">
                <div class="card-header bg-warning text-white border-0">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h5 class="mb-0">
                                <i class="ti ti-alert-triangle me-2"></i>
                                Pemberitahuan Penting - Outstanding PPAP Dokumen
                            </h5>
                            <p class="mb-0 small mt-1 opacity-90">
                                Anda memiliki <span id="outstanding-count" class="fw-bold">0</span> permintaan dokumen yang memerlukan perhatian
                            </p>
                        </div>
                        <button type="button" class="btn btn-sm btn-light" id="dismiss-all-alerts">
                            <i class="ti ti-x"></i> Tutup Semua
                        </button>
                    </div>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead class="bg-light">
                                <tr>
                                    <th>No</th>
                                    <th>Request Date</th>
                                    <th>Model</th>
                                    <th>Due Date</th>
                                    <th>Status</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="outstanding-table-body">
                                <tr>
                                    <td colspan="6" class="text-center">Loading...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="card-footer bg-light">
                        <div class="row text-center">
                            <div class="col-3">
                                <div class="h4" id="stat-total">0</div>
                                <small>Total</small>
                            </div>
                            <div class="col-3">
                                <div class="h4" id="stat-open">0</div>
                                <small>Open</small>
                            </div>
                            <div class="col-3">
                                <div class="h4" id="stat-reject">0</div>
                                <small>Reject</small>
                            </div>
                            <div class="col-3">
                                <div class="h4" id="stat-overdue">0</div>
                                <small>Overdue</small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Test script
        console.log('Test page loaded');
        
        // Manually test API call
        const token = 'jKF7xz78sPGfQOa51fcaudt0fQip9Mp3unY79YzVp6rP64G6lfeeCSsncTyr57Ua'; // Replace with actual token
        const apiUrl = `/supplier/${token}/api/outstanding-documents`;
        
        console.log('Testing API:', apiUrl);
        
        fetch(apiUrl)
            .then(response => {
                console.log('Response status:', response.status);
                return response.json();
            })
            .then(data => {
                console.log('API Response:', data);
                document.getElementById('test-result').innerHTML = `
                    <div class="alert alert-success">
                        <h4>API Test Successful!</h4>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    </div>
                `;
                
                if (data.success && data.data.length > 0) {
                    document.getElementById('outstanding-alert-container').style.display = 'block';
                }
            })
            .catch(error => {
                console.error('API Error:', error);
                document.getElementById('test-result').innerHTML = `
                    <div class="alert alert-danger">
                        <h4>API Test Failed!</h4>
                        <p>${error.message}</p>
                    </div>
                `;
            });
    </script>
    
    <script src="/js/outstanding-alert.js"></script>
</body>
</html>
